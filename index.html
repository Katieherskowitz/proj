<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Echo Stage — speak, see it fly, save the show</title>
    <!-- No external fonts: loading google fonts can block rendering and leave a white screen when offline. -->
    <style>
      :root {
        color-scheme: dark;
        --bg1: #1a0a2e;
        --bg2: #0d0221;
        --accent: #ff6bcb;
        --accent2: #00d4ff;
        --card: rgba(18, 12, 40, 0.85);
        --border: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: #1a0a2e;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background:
          radial-gradient(ellipse 120% 80% at 50% -20%, #4a1d6e 0%, transparent 50%),
          radial-gradient(ellipse 80% 50% at 100% 50%, rgba(0, 212, 255, 0.08) 0%, transparent 45%),
          radial-gradient(ellipse 80% 50% at 0% 80%, rgba(255, 107, 203, 0.1) 0%, transparent 45%),
          linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
        color: #f0e8ff;
        display: grid;
        place-items: center;
        padding: 1rem;
      }

      .app {
        width: min(96vw, 1100px);
        display: grid;
        gap: 1.25rem;
      }

      .top-bar {
        text-align: center;
      }

      .badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent2);
        background: rgba(0, 212, 255, 0.12);
        border: 1px solid rgba(0, 212, 255, 0.35);
        padding: 0.35rem 0.85rem;
        border-radius: 999px;
        margin-bottom: 0.75rem;
        animation: pulse-glow 2.5s ease-in-out infinite;
      }

      @keyframes pulse-glow {
        0%,
        100% {
          box-shadow: 0 0 12px rgba(0, 212, 255, 0.2);
        }
        50% {
          box-shadow: 0 0 24px rgba(255, 107, 203, 0.35);
        }
      }

      .top-bar h1 {
        margin: 0;
        font-family: ui-rounded, system-ui, -apple-system, sans-serif;
        font-size: clamp(2rem, 5vw, 3.25rem);
        font-weight: 700;
        line-height: 1.1;
        background: linear-gradient(120deg, #fff 0%, var(--accent2) 45%, var(--accent) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 2px 20px rgba(255, 107, 203, 0.25));
      }

      .tagline {
        margin: 0.6rem 0 0;
        font-size: clamp(1rem, 2.2vw, 1.2rem);
        color: rgba(255, 255, 255, 0.78);
        max-width: 36ch;
        margin-left: auto;
        margin-right: auto;
      }

      .rotating-hint {
        margin-top: 0.5rem;
        font-size: 0.95rem;
        color: rgba(255, 200, 120, 0.95);
        min-height: 1.4em;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.85rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 1rem 1.1rem;
        backdrop-filter: blur(12px);
      }

      .btn-primary {
        border: none;
        border-radius: 999px;
        padding: 0.75rem 1.35rem;
        font-family: ui-rounded, system-ui, -apple-system, sans-serif;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent) 0%, #a855f7 50%, var(--accent2) 100%);
        background-size: 200% auto;
        color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        transition: transform 0.2s ease, filter 0.2s ease, background-position 0.4s ease;
      }

      .btn-primary:hover:not(:disabled) {
        filter: brightness(1.08);
        transform: scale(1.03) translateY(-2px);
        background-position: 100% center;
      }

      .btn-secondary {
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-radius: 999px;
        padding: 0.7rem 1.2rem;
        font-family: ui-rounded, system-ui, -apple-system, sans-serif;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        transition: background 0.2s, transform 0.2s;
      }

      .btn-secondary:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.14);
        transform: translateY(-2px);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }

      .slider-wrap {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        font-size: 0.92rem;
        color: rgba(255, 255, 255, 0.85);
        flex-wrap: wrap;
        justify-content: center;
      }

      .slider-wrap span.label {
        font-weight: 600;
        color: #ffd86b;
      }

      input[type="range"] {
        width: min(200px, 45vw);
        accent-color: var(--accent2);
      }

      .stage-wrap {
        border: 2px solid transparent;
        background:
          linear-gradient(var(--bg2), var(--bg2)) padding-box,
          linear-gradient(135deg, rgba(255, 107, 203, 0.5), rgba(0, 212, 255, 0.5), rgba(168, 85, 247, 0.5))
            border-box;
        border-radius: 24px;
        overflow: hidden;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.5),
          0 0 60px rgba(168, 85, 247, 0.15);
        transform: perspective(1100px) rotateX(2deg);
      }

      canvas {
        width: 100%;
        height: auto;
        display: block;
      }

      .status-panel {
        text-align: center;
        color: rgba(200, 210, 255, 0.9);
        font-size: 0.98rem;
      }

      .status-panel p {
        margin: 0.25rem 0;
      }

      .hint {
        opacity: 0.75;
        font-size: 0.88rem;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="top-bar">
        <span class="badge">Live word beam</span>
        <h1>Echo Stage</h1>
        <p class="tagline">
          Yell a poem, tell a joke, freestyle—your words hit the wall and swim across the lights.
        </p>
        <p class="rotating-hint" id="rotatingHint" aria-live="polite"></p>
      </header>

      <section class="controls">
        <button type="button" class="btn-primary" id="startBtn">Lights on — go!</button>
        <button type="button" class="btn-secondary" id="stopBtn" disabled>Curtain &amp; save video</button>
        <label class="slider-wrap" for="twistRate">
          <span class="label">Surprise</span>
          <input id="twistRate" type="range" min="0" max="0.6" step="0.05" value="0.2" />
          <span id="twistRateValue">20%</span>
        </label>
      </section>

      <section class="stage-wrap">
        <canvas id="projectionCanvas" width="1280" height="720"></canvas>
      </section>

      <section class="status-panel">
        <p><strong>Status:</strong> <span id="statusText">Ready when you are.</span></p>
        <p class="hint">Chrome works best. Allow the mic when your browser asks.</p>
      </section>

      <p
        id="bootError"
        style="
          display: none;
          margin: 1rem auto 0;
          max-width: 40rem;
          padding: 1rem;
          border-radius: 12px;
          background: rgba(180, 40, 60, 0.25);
          border: 1px solid rgba(255, 120, 140, 0.5);
          color: #ffd0d8;
          text-align: center;
          font-size: 0.95rem;
        "
      ></p>
    </main>

    <script>
      (function () {
        var bootError = document.getElementById("bootError");
        function showBootError(msg) {
          if (bootError) {
            bootError.style.display = "block";
            bootError.textContent = msg;
          }
        }

        var canvas = document.getElementById("projectionCanvas");
        if (!canvas) {
          showBootError("Could not find the stage canvas. Try reloading the page.");
          return;
        }
        var ctx = canvas.getContext("2d");
        if (!ctx) {
          showBootError("This browser cannot draw on the stage (2D canvas). Try Chrome or Firefox.");
          return;
        }

        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");
        const statusText = document.getElementById("statusText");
        const twistRateInput = document.getElementById("twistRate");
        const twistRateValue = document.getElementById("twistRateValue");
        const rotatingHint = document.getElementById("rotatingHint");

        const hints = [
          "Try whispering vs. shouting—the beam feels different.",
          "Say something ridiculous. The wall won't judge.",
          "Rhyme if you want. The lights love a bounce.",
          "End with a mic-drop line, then hit save.",
        ];
        let hintIndex = 0;
        if (rotatingHint) {
          rotatingHint.textContent = hints[0];
          setInterval(function () {
            hintIndex = (hintIndex + 1) % hints.length;
            rotatingHint.textContent = hints[hintIndex];
          }, 4500);
        }

        const SpeechRecognition =
          window.SpeechRecognition || window.webkitSpeechRecognition;

        let recognition;
        let isListening = false;
        let animationId;
        let createdAt = 0;
        let phraseQueue = [];
        let fullTranscript = [];
        let twistRate = twistRateInput ? Number(twistRateInput.value) : 0.2;
        if (Number.isNaN(twistRate)) twistRate = 0.2;

        let recorder;
        let chunks = [];

        const confusions = {
          your: "you're",
          there: "their",
          hear: "here",
          where: "wear",
          to: "too",
          sea: "see",
          weather: "whether",
          know: "no",
          right: "write",
          one: "won",
        };

        const wordPalette = [
          [255, 220, 120],
          [120, 255, 220],
          [255, 140, 200],
          [160, 200, 255],
          [200, 160, 255],
        ];

        if (twistRateValue) twistRateValue.textContent = Math.round(twistRate * 100) + "%";

        if (twistRateInput && twistRateValue) {
          twistRateInput.addEventListener("input", function () {
            twistRate = Number(twistRateInput.value);
            twistRateValue.textContent = Math.round(twistRate * 100) + "%";
          });
        }

        if (startBtn) startBtn.addEventListener("click", startSession);
        if (stopBtn) stopBtn.addEventListener("click", stopSessionAndSave);

        function startSession() {
          if (!window.isSecureContext) {
            setStatus("Use http://localhost in your browser so the mic can turn on.");
            return;
          }
          if (!SpeechRecognition) {
            setStatus("This browser needs Chrome (or similar) for live speech here.");
            return;
          }
          if (isListening) return;

          recognition = new SpeechRecognition();
          recognition.continuous = true;
          recognition.interimResults = true;
          recognition.lang = "en-US";

          recognition.onresult = handleSpeechResult;
          recognition.onerror = function (event) {
            var errors = {
              "not-allowed": "Mic is blocked—click the lock icon and allow the microphone.",
              "service-not-allowed": "Speech needs a quick browser tweak—try Chrome and reload.",
              "audio-capture": "No mic found—plug one in or pick a device in system settings.",
            };
            setStatus(errors[event.error] || "Speech: " + event.error);
          };
          recognition.onend = function () {
            if (isListening) recognition.start();
          };

          phraseQueue = [];
          fullTranscript = [];
          createdAt = performance.now();
          isListening = true;

          startBtn.disabled = true;
          stopBtn.disabled = false;
          setStatus("You're on—speak loud and proud!");

          startRecording();
          recognition.start();
          loop();
        }

        function stopSessionAndSave() {
          if (!isListening) return;
          isListening = false;

          if (recognition) recognition.stop();
          if (animationId) cancelAnimationFrame(animationId);

          startBtn.disabled = false;
          stopBtn.disabled = true;
          setStatus("Wrapping your clip…");

          stopRecordingAndDownload();
        }

        function handleSpeechResult(event) {
          for (var i = event.resultIndex; i < event.results.length; i++) {
            var raw = event.results[i][0].transcript.trim();
            if (!raw) continue;

            var transformed = applyTwist(raw, twistRate);
            if (event.results[i].isFinal) {
              fullTranscript.push(transformed);
              phraseQueue.push(createPhrase(transformed, true));
            } else {
              phraseQueue.push(createPhrase(transformed, false));
            }
          }
        }

        function createPhrase(text, isFinal) {
          var rgb = wordPalette[Math.floor(Math.random() * wordPalette.length)];
          var alpha = isFinal ? 0.96 : 0.72;
          return {
            text: text,
            isFinal: isFinal,
            createdAt: performance.now(),
            baseY: 120 + Math.random() * (canvas.height - 240),
            speed: 38 + Math.random() * 55,
            r: rgb[0],
            g: rgb[1],
            b: rgb[2],
            alpha: alpha,
            size: isFinal ? 46 + Math.random() * 8 : 32 + Math.random() * 6,
            wobble: 0.8 + Math.random() * 1.4,
          };
        }

        function loop(now) {
          now = now === undefined ? performance.now() : now;
          drawBackground(now);
          drawPhrases(now);
          drawHUD(now);
          animationId = requestAnimationFrame(loop);
        }

        function drawBackground(now) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          var gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
          gradient.addColorStop(0, "#14082a");
          gradient.addColorStop(0.45, "#0a1028");
          gradient.addColorStop(1, "#050510");
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          var beamDrift = Math.sin(now * 0.00085) * 90;
          var leftBeam = ctx.createLinearGradient(0, 0, canvas.width * 0.45, canvas.height);
          leftBeam.addColorStop(0, "rgba(255, 100, 200, 0.22)");
          leftBeam.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = leftBeam;
          ctx.beginPath();
          ctx.moveTo(canvas.width * 0.12 + beamDrift, 0);
          ctx.lineTo(canvas.width * 0.28 + beamDrift, 0);
          ctx.lineTo(canvas.width * 0.48, canvas.height);
          ctx.lineTo(0, canvas.height);
          ctx.closePath();
          ctx.fill();

          var rightBeam = ctx.createLinearGradient(canvas.width, 0, canvas.width * 0.55, canvas.height);
          rightBeam.addColorStop(0, "rgba(0, 220, 255, 0.2)");
          rightBeam.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = rightBeam;
          ctx.beginPath();
          ctx.moveTo(canvas.width * 0.88 - beamDrift, 0);
          ctx.lineTo(canvas.width * 0.72 - beamDrift, 0);
          ctx.lineTo(canvas.width * 0.52, canvas.height);
          ctx.lineTo(canvas.width, canvas.height);
          ctx.closePath();
          ctx.fill();

          var pulse = 0.1 + Math.sin(now * 0.0013) * 0.09;
          ctx.fillStyle = "rgba(180, 120, 255, " + Math.max(0.06, pulse) + ")";
          ctx.beginPath();
          ctx.ellipse(
            canvas.width * 0.5,
            canvas.height * 0.46,
            380,
            170,
            0,
            0,
            Math.PI * 2
          );
          ctx.fill();

          for (var sy = 0; sy < canvas.height; sy += 4) {
            ctx.fillStyle = "rgba(255,255,255,0.028)";
            ctx.fillRect(0, sy, canvas.width, 1);
          }

          var vignette = ctx.createRadialGradient(
            canvas.width / 2,
            canvas.height / 2,
            canvas.height * 0.18,
            canvas.width / 2,
            canvas.height / 2,
            canvas.height * 0.82
          );
          vignette.addColorStop(0, "rgba(0,0,0,0)");
          vignette.addColorStop(1, "rgba(0,0,0,0.58)");
          ctx.fillStyle = vignette;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawPhrases(now) {
          var maxAge = 14000;
          phraseQueue = phraseQueue.filter(function (p) {
            return now - p.createdAt < maxAge;
          });

          phraseQueue.forEach(function (phrase, index) {
            var age = (now - phrase.createdAt) / 1000;
            var x = canvas.width - age * phrase.speed * 17 + index * 12;
            var wave =
              Math.sin(age * phrase.wobble * 2.8 + index * 0.5) * 28 +
              Math.cos(age * 1.7 + index) * 8;
            var y = phrase.baseY + wave;
            var fade = Math.max(0, 1 - age / 8.5);
            var a = phrase.alpha * fade;

            ctx.save();
            ctx.font =
              "700 " + phrase.size + "px ui-rounded, system-ui, -apple-system, sans-serif";
            ctx.fillStyle = "rgba(" + phrase.r + "," + phrase.g + "," + phrase.b + "," + a + ")";
            ctx.shadowColor = "rgba(" + phrase.r + "," + phrase.g + "," + phrase.b + ",0.55)";
            ctx.shadowBlur = phrase.isFinal ? 22 : 12;
            ctx.fillText(phrase.text, x, y);
            ctx.shadowBlur = 0;
            ctx.restore();
          });
        }

        function drawHUD(now) {
          var elapsed = ((now - createdAt) / 1000).toFixed(1);
          ctx.fillStyle = "rgba(255,255,255,0.82)";
          ctx.font = "600 22px system-ui, -apple-system, sans-serif";
          ctx.fillText("ECHO STAGE", 32, 42);
          ctx.font = "400 18px system-ui, -apple-system, sans-serif";
          ctx.fillStyle = "rgba(255,230,180,0.9)";
          ctx.fillText(elapsed + "s on the wall", 32, 72);
          ctx.fillStyle = "rgba(255,255,255,0.55)";
          ctx.font = "14px system-ui, -apple-system, sans-serif";
          ctx.fillText("surprise " + Math.round(twistRate * 100) + "%", 32, 98);
        }

        function applyTwist(input, rate) {
          return input
            .split(/\s+/)
            .map(function (word) {
              if (Math.random() > rate) return word;
              var cleaned = word.toLowerCase().replace(/[^a-z]/g, "");
              if (confusions[cleaned]) return preserveCase(word, confusions[cleaned]);
              return typo(word);
            })
            .join(" ");
        }

        function typo(word) {
          if (word.length < 4) return word;
          var letters = word.split("");
          var i = 1 + Math.floor(Math.random() * (letters.length - 2));
          var j = Math.max(1, i - 1);
          var t = letters[j];
          letters[j] = letters[i];
          letters[i] = t;
          return letters.join("");
        }

        function preserveCase(original, replacement) {
          if (original[0] === original[0].toUpperCase()) {
            return replacement[0].toUpperCase() + replacement.slice(1);
          }
          return replacement;
        }

        function setStatus(message) {
          if (statusText) statusText.textContent = message;
        }

        function startRecording() {
          chunks = [];
          var stream = canvas.captureStream(30);
          var mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
            ? "video/webm;codecs=vp9"
            : "video/webm";
          recorder = new MediaRecorder(stream, { mimeType: mimeType });
          recorder.ondataavailable = function (e) {
            if (e.data.size > 0) chunks.push(e.data);
          };
          recorder.start(200);
        }

        function stopRecordingAndDownload() {
          if (!recorder || recorder.state === "inactive") {
            setStatus("Done.");
            return;
          }

          recorder.onstop = function () {
            var blob = new Blob(chunks, { type: "video/webm" });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            var stamp = new Date().toISOString().replace(/[:.]/g, "-");
            a.href = url;
            a.download = "echo-stage-" + stamp + ".webm";
            a.click();
            URL.revokeObjectURL(url);
            setStatus("Saved! Your clip is downloading. Come back anytime.");
          };

          recorder.stop();
        }

        try {
          createdAt = performance.now();
          loop();
        } catch (err) {
          showBootError(
            "Something went wrong starting the stage: " + (err && err.message ? err.message : String(err))
          );
        }
      })();
    </script>
  </body>
</html>
